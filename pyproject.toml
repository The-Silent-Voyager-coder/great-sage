[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "great-sage"
version = "0.3.0"
description = "Great Sage (Wise One) — a modular, local-first personal AI operating system"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = ["assistant", "ai", "local-first", "automation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
]

# Dependency policy: docs/DEPENDENCY_POLICY.md
# PyYAML is required for the documented YAML configuration format.
# Every future addition requires written justification (§5 table).
dependencies = [
    "PyYAML>=6.0",
    # Roadmap Phase A (real local voice): Vosk offline STT + Piper neural TTS.
    # Both run fully offline on Windows with model files under C:/GREATSAGE/models.
    "vosk>=0.3.45",
    "piper-tts>=1.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "ruff>=0.5",
]

[project.scripts]
greatsage = "greatsage.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["greatsage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.mypy]
python_version = "3.11"
files = ["greatsage"]
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true

# Third-party voice/ML stubs target newer Pythons than our 3.11 floor
# (or ship none at all); our code is unaffected, so skip them.
[[tool.mypy.overrides]]
module = ["vosk", "piper.*", "numpy", "numpy.*", "onnxruntime.*", "google.protobuf.*", "sounddevice"]
ignore_errors = true
ignore_missing_imports = true
follow_imports = "silent"