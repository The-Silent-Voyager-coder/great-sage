# Great Sage example configuration.
# Copy to config/sage.yaml and edit. Secrets go in .env, never here.
# The authoritative schema is documented in docs/CONFIGURATION.md.

core:
  name: "Great Sage"
  data_dir: "C:/GREATSAGE/data"
  cache_dir: "C:/GREATSAGE/cache"
  logs_dir: "C:/GREATSAGE/logs"
  runtime_dir: "C:/GREATSAGE/runtime"
  workspaces_dir: "C:/GREATSAGE/workspaces"
  models_dir: "C:/GREATSAGE/models"
  backups_dir: "C:/GREATSAGE/backups"
  timezone: "Asia/Kolkata"

logging:
  level: "INFO"
  format: "json"
  retention_days: 30

events:
  queue_maxsize: 1000
  worker_count: 4

ai:
  default_provider: "local"
  providers:
    local:
      type: "local"
      enabled: true
      # Do not hard-code a model until hardware benchmarking is performed.
      # Example: model: "qwen2.5:7b-instruct"
      base_url: "http://127.0.0.1:11434"   # Ollama
      model: ""
      timeout_seconds: 120
    opencode:
      type: "opencode"
      enabled: false
      base_url: "http://127.0.0.1:4096"
      api_key_env: "OPENCODE_API_KEY"
      # Default model for direct calls, "provider/model#variant" shape.
      # "" = server default. Variants are server-side effort presets
      # (none/minimal/low/medium/high/xhigh where the model offers them).
      # Example: "opencode/muse-spark-1.3-contributor-free#medium"
      model: ""
      timeout_seconds: 300

memory:
  enabled: true
  database_path: "C:/GREATSAGE/data/sage-memory.db"
  auto_save_conversations: false
  default_confidence: 0.8
  retention_days: 365
  # Semantic recall (roadmap Phase B): embed saves via a local Ollama
  # embedding model and rank `memory search --semantic` by similarity.
  # Vectors never leave the machine. Needs the model pulled once:
  #   ollama pull nomic-embed-text
  embeddings_enabled: false
  embedding_model: "nomic-embed-text"
  embedding_base_url: "http://127.0.0.1:11434"

tasks:
  max_iterations: 10
  default_timeout_minutes: 30
  persist_interval_seconds: 5

tools:
  # Explicit working directory for tool execution (never arbitrary CWD).
  working_directory: "C:/GREATSAGE/workspaces"
  # Every tool execution must complete within this timeout.
  execution_timeout_seconds: 30
  # Cap on output (bytes) captured per tool execution.
  max_output_bytes: 65536
  # Roots tools may touch. Paths are canonicalized; traversal is blocked.
  allowed_roots:
    - "C:/GREATSAGE/workspaces"
  denied_roots: []
  terminal:
    default_risk: "LOW_WRITE"
  browser:
    default_risk: "READ"

agent:
  # Bounded AI tool-calling loop (Phase 5A). All limits are validated
  # against absolute safety ceilings at load time and are never unlimited.
  enabled: true
  # Maximum AI turns per task.
  max_steps: 12
  # Maximum total tool calls per task.
  max_tool_calls: 8
  # Wall-clock budget for the whole task (seconds).
  max_wall_time_seconds: 300
  # Maximum tool calls the AI may request in a single response.
  max_single_tool_calls: 3
  # Maximum accumulated tool output bytes per task.
  max_total_tool_output_bytes: 2097152
  # Consecutive identical tool calls (same tool + arguments) that end a run.
  loop_detection_threshold: 3

delegation:
  # Controlled OpenCode execution under JARVIS authority (Phase 5B).
  # JARVIS validates, secures, permissions, monitors, and cancels; the
  # executor only codes. All limits are validated against absolute safety
  # ceilings at load time and are never unlimited.
  enabled: false
  # Registered provider that must expose the delegation capability.
  default_provider: "opencode"
  # Wall-clock budget per delegated task (seconds).
  max_wall_time_seconds: 1800
  # Maximum accumulated executor output bytes per task.
  max_output_bytes: 4194304
  # Maximum executor permission requests per task (0 would mean none).
  max_permission_requests: 50
  # Maximum concurrently running delegated sessions.
  max_session_count: 3
  # Maximum delegation depth; 1 means no recursive delegation.
  max_delegation_depth: 1

workspace:
  # Workspace discovery (Phase 6) — enumerate allowed roots, detect type.
  enabled: true
  max_scan_depth: 3
  max_entries: 500
  scan_timeout_seconds: 10
  database_path: "C:/GREATSAGE/data/sage-workspace.db"

planning:
  # Deterministic plan decomposition (Phase 6) — no AI provider calls.
  enabled: true
  max_plan_steps: 25
  database_path: "C:/GREATSAGE/data/sage-plans.db"

task:
  # Bounded multi-step execution over the secure tool pipeline (Phase 6).
  enabled: true
  max_steps: 25
  per_step_timeout_seconds: 30
  total_timeout_seconds: 600
  database_path: "C:/GREATSAGE/data/sage-tasks.db"

scheduler:
  # Bounded recurring jobs (roadmap Phase C) — tick via `jarvis schedule tick`
  # (directly or from Windows Task Scheduler). No daemon.
  enabled: true
  max_schedules: 50
  database_path: "C:/GREATSAGE/data/sage-scheduler.db"

telegram:
  # Remote chat: message the bot from anywhere; the laptop stays home online.
  # 1. Create a bot with @BotFather, 2. export TELEGRAM_BOT_TOKEN (never commit
  # it), 3. message the bot once, read your chat id from
  # https://api.telegram.org/bot<TOKEN>/getUpdates, 4. list it below.
  enabled: false
  token_env: "TELEGRAM_BOT_TOKEN"
  allowed_chat_ids: []
  poll_timeout_seconds: 20
  max_listen_seconds: 600

security:
  # Tool-system security mode: lockdown | normal | development
  # lockdown: SAFE tools only. normal: SAFE/LOW auto, MEDIUM/HIGH ask.
  # development: more permissive, but CRITICAL tools are always denied.
  mode: "normal"
  # allow | ask | deny
  default_mode: "ask"
  allow_auto_approve_read: true
  destructive_confirm: true
  audit_log: "C:/GREATSAGE/data/sage-audit.log"

voice:
  # Mocks by default (deterministic, no downloads). Real local engines:
  # stt vosk (needs: pip install vosk + model in {models_dir}/vosk/),
  # tts piper (needs: pip install piper-tts + voice in {models_dir}/piper/),
  # wake_word fuzzy (stdlib, tolerant text match). Missing pieces report
  # unavailable in `voice health` instead of failing silently.
  wake_word:
    enabled: false
    model: "keyword"
  stt:
    engine: "mock"
    model: "small"
    language: "en"
  tts:
    engine: "mock"
    voice: "en_GB-alan-medium"
